---
# Install the g1_ros system configuration into /etc as symlinks that point back
# at the files in this repository, then apply it:
#   etc/systemd/*.service -> /etc/systemd/system/ (+ systemctl daemon-reload)
#   etc/sysctl/*.conf     -> /etc/sysctl.d/       (+ sysctl --system)
# Editing a file in the repo is immediately reflected after the corresponding
# reload, because the installed file is a symlink, not a copy.
#
# Usage
# -----
# On the robot itself (control node == target):
#   ansible-playbook --ask-become-pass etc/install.yml
#
# From a separate control node (override the target-side repo path):
#   ansible-playbook -i <robot-host>, -u unitree --become \
#       -e g1_ros_dir=/home/unitree/ros/colcon_ws/src/g1_ros \
#       etc/install.yml
#
# g1_ros_dir must be the ABSOLUTE path of this repo *on the target*, because the
# installed symlinks are resolved on the target at boot. It defaults to this
# playbook's parent directory, which is correct when Ansible runs on the robot.
- name: Install g1_ros system configuration as symlinks
  hosts: localhost
  become: true
  vars:
    g1_ros_dir: "{{ playbook_dir | dirname }}"
    systemd_dir: /etc/systemd/system
    sysctl_dir: /etc/sysctl.d
    # enabled = autostart at boot (inspire-g1 keeps [Install], so false disables it).
    g1_services:
      - name: inspire-g1.service
        enabled: false
      - name: gear-sonic.service
        enabled: false
      - name: ros2-g1-gear-sonic-bringup.service
        enabled: false
      - name: ros-interaction.service
        enabled: false
    # Kernel tuning the DDS middleware needs (large UDP socket buffers).
    g1_sysctl_files:
      - 99-ros2-dds.conf
  tasks:
    - name: Symlink unit files into {{ systemd_dir }}
      ansible.builtin.file:
        src: "{{ g1_ros_dir }}/etc/systemd/{{ item.name }}"
        dest: "{{ systemd_dir }}/{{ item.name }}"
        state: link
        force: true
      loop: "{{ g1_services }}"
      notify: Reload systemd

    - name: Symlink sysctl drop-ins into {{ sysctl_dir }}
      ansible.builtin.file:
        src: "{{ g1_ros_dir }}/etc/sysctl/{{ item }}"
        dest: "{{ sysctl_dir }}/{{ item }}"
        state: link
        force: true
      loop: "{{ g1_sysctl_files }}"
      notify: Apply sysctl settings

    - name: Reload systemd and apply sysctl before enabling
      ansible.builtin.meta: flush_handlers

    - name: Apply each unit's boot-autostart state
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: "{{ item.enabled }}"
      loop: "{{ g1_services }}"
      loop_control:
        label: "{{ item.name }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: true
