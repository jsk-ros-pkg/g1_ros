    max_acceleration: 100.0
  waist_roll_joint:
    has_velocity_limits: true
    max_velocity: 30.0
    has_acceleration_limits: true
    max_acceleration: 100.0
  waist_pitch_joint:
    has_velocity_limits: true
    max_velocity: 30.0
    has_acceleration_limits: true
    max_acceleration: 100.0
  # Inspire DFQ left hand. The URDF limits these joints to 0.5 rad/s but does
  # not provide acceleration limits, which are required by MoveIt's time
  # parameterization response adapter. Keep the planner-side limits
  # conservative; the global 0.1 scaling factors above still apply.
