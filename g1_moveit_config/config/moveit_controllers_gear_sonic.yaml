# MoveIt controller config for gear_sonic (SONIC) whole-body control.
#
# Instead of the ros2_control upper_body_controller (rt/arm_sdk, conflicts with
# the SONIC policy), trajectories are executed by the
# gear_sonic_controller node (g1_hardware), which converts them to
# VR 3-point end-effector targets via FK. Only the wrist/torso poses are
# reproduced — the RL policy may realise different joint angles.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - gear_sonic_controller
    - right_hand_controller
    - left_hand_controller

  gear_sonic_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - pelvis_height_joint
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint

  right_hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - R_thumb_proximal_yaw_joint
      - R_thumb_proximal_pitch_joint
      - R_index_proximal_joint
      - R_middle_proximal_joint
      - R_ring_proximal_joint
      - R_pinky_proximal_joint

  left_hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - L_thumb_proximal_yaw_joint
      - L_thumb_proximal_pitch_joint
      - L_index_proximal_joint
      - L_middle_proximal_joint
      - L_ring_proximal_joint
      - L_pinky_proximal_joint
