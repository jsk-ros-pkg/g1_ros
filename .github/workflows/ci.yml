name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            rosdep_skip_keys: catkin g1_description gazebo joint_state_publisher_gui message_generation message_runtime roscpp roslaunch rviz unitree_sdk2
          - runner: ubuntu-24.04-arm
            rosdep_skip_keys: catkin g1_description gazebo joint_state_publisher_gui message_generation message_runtime moveit_ros_control_interface roscpp roslaunch rviz unitree_sdk2
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute image tags and whether to push
        id: meta
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_RUNNER: ${{ matrix.runner }}
        run: |
          # master -> ':latest'; other branches and PRs -> ':<branch>' and ':<sha>'.
          # docker tags only allow [A-Za-z0-9_.-] and no '/', so sanitize the branch.
          image="${REGISTRY}/${IMAGE_NAME,,}"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            tags="${image}:latest"
          else
            branch="$(printf '%s' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | sed -e 's#[^A-Za-z0-9.-]#-#g' -e 's#^[.-]*##')"
            [ -z "$branch" ] && branch="branch"
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            tags="${image}:${branch:0:100} ${image}:${sha}"
          fi

          # Build on arm only; publish local pushes, manual runs, and same-repo PRs.
          docker_commit=""
          push=false
          if [ "$CI_RUNNER" = "ubuntu-24.04-arm" ]; then
            docker_commit="${tags%% *}"
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              push=true
            elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              push=true
            fi
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "docker_commit=${docker_commit}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"
          echo "tags=[${tags}] push=${push}"

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          UPSTREAM_WORKSPACE: .github/upstream.jazzy.repos
          UPSTREAM_CMAKE_ARGS: --packages-select g1_description unitree_sdk2
          ROSDEP_SKIP_KEYS: ${{ matrix.rosdep_skip_keys }}
          DOCKER_COMMIT: ${{ steps.meta.outputs.docker_commit }}

      - name: Push image
        if: steps.meta.outputs.push == 'true'
        run: |
          primary="${{ steps.meta.outputs.docker_commit }}"
          for t in ${{ steps.meta.outputs.tags }}; do
            [ "$t" = "$primary" ] || docker tag "$primary" "$t"
            docker push "$t"
          done
